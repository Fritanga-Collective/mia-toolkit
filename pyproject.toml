[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mia-toolkit"
version = "0.1.12"
description = "Consolidate hospital imaging CDs into a single DICOM archive"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pydicom>=3.0",
    "openpyxl>=3.1",
    "certifi>=2024.0.0",  # CA store for the update check in frozen builds
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
profile = [
    "pyinstrument>=4.6",
    "scalene>=1.5",
    "snakeviz>=2.2",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
mia = "mia.gui.app:main"
mia-rip = "mia_core.ripper:main"
mia-inventory = "mia_core.inventory:main"
mia-build = "mia_core.dicomdir:main"

[tool.setuptools.packages.find]
include = ["mia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `from tests.helpers import ...` resolves
# under the bare `pytest` command (CI), not just `python -m pytest`.
pythonpath = ["."]
