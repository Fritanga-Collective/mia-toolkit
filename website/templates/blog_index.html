<!DOCTYPE html>
<html lang="{{_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BLOG_INDEX_TITLE}}</title>
  <meta name="description" content="{{blog.meta_desc}}">
  <link rel="stylesheet" href="{{P}}styles.css">
  <script src="{{P}}lang.js"></script>
  <!-- No cookies, no tracking. Page counts: GoatCounter
       (cookieless, aggregate) — details in privacy.html -->
{{HEAD_SEO}}
{{JSON_LD}}
</head>
<body>
  <header>
    <div class="wrap topbar">
      <a class="brand" href="{{HOME}}">MIA Toolkit</a>
      <nav class="lang">
        <a href="{{HELP}}">{{nav.help}}</a>
        <span>|</span>
        <a href="{{SUPPORT}}">{{nav.support}}</a>
{{LANGSEL}}
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>{{BLOG_INDEX_TITLE}}</h1>
      <ul class="blog-list">
{{BLOG_LIST}}
      </ul>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p class="disclaimer">{{footer.disclaimer}}</p>
      <p>{{footer.ethos}} ·
        <a href="{{HELP}}">{{footer.help}}</a> ·
        <a href="{{PRIVACY}}">{{footer.privacy}}</a> ·
        <a href="{{STATS}}">{{footer.stats}}</a></p>
      <p class="made-by">{{footer.made_by_pre}}<a href="https://fritanga.co">Fritanga</a>{{footer.made_by_post}}</p>
    </div>
  </footer>
</body>
</html>
