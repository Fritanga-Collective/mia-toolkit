<!DOCTYPE html>
<html lang="{{INST_LOCALE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <!-- Standalone request form: the no-JS target of a market page's request
       CTAs (pilot, pricing tier, procurement kit), prefilled at build time.
       With JS the same form opens in a dialog on the market page instead.
       Not indexed, not in the sitemap or the hreflang cluster. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{CANONICAL}}">
{{FAVICONS}}
  <link rel="preload" href="/fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/track.js" defer></script>
  <script src="/inst.js" defer></script>
</head>
<body class="inst">
  <a class="i-skip" href="#main">{{instp.skip}}</a>
{{INST_SHELL}}

  <main id="main">
    <section class="i-band i-request-page">
      <div class="i-container">
        <p><a href="{{BACK_URL}}">← {{instp.thanks_back}}</a></p>
{{INST_PILOT_FORM}}
      </div>
    </section>
  </main>

{{INST_FOOTER}}
</body>
</html>
