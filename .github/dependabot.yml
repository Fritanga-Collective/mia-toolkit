# Dependabot: weekly version-update PRs (security updates are enabled in repo
# settings and arrive as soon as an advisory is published).
version: 2
updates:
  # App + core library (pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Website generator's build-time dependency (website/requirements.txt).
  - package-ecosystem: pip
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  # GitHub Actions used by the workflows (keeps pinned versions current).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
