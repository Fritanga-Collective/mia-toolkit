# Dependabot: weekly version-update PRs (security updates are enabled in repo
# settings and arrive as soon as an advisory is published).
version: 2
updates:
  # App + core library (pyproject.toml). This root entry also picks up the
  # website's build dependency (website/requirements.txt), so there is no
  # separate /website entry: two entries opened duplicate PRs (#44 and #46).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows (keeps pinned versions current).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
