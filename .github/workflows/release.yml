name: Release

# On a version tag (v1.2.3): test on all OSes, build the macOS .dmg and the
# Windows installer .exe, smoke-test each BUILT artifact (headless --selftest),
# and attach them to the GitHub Release together with SHA256SUMS, one CycloneDX
# SBOM per platform and GitHub build-provenance attestations.
#
# macOS signing/notarization and Windows signing each run only when their
# secrets are present; otherwise UNSIGNED artifacts are built so the pipeline
# still produces downloads. macOS secrets are configured (signed + notarized
# since v0.1.5); Windows stays unsigned until a signing route is live.
#
# Required secrets for signed macOS builds (optional until you have a cert):
#   MACOS_SIGN_ID         e.g. "Developer ID Application: NAME (TEAMID)"
#   MACOS_CERT_P12        base64 of the exported .p12 certificate
#   MACOS_CERT_PASSWORD   password for the .p12
#   APPLE_ID              Apple ID email (for notarytool)
#   APPLE_TEAM_ID         10-char Team ID
#   APPLE_APP_PASSWORD    app-specific password
#
# Windows signing via SignPath Foundation (free OSS code signing; publisher
# shows "SignPath Foundation"). Microsoft Trusted Signing is region-blocked for
# Mexico — dormant runbook in int-docs/infra/AZURE-TRUSTED-SIGNING.md.
# Required once the SignPath application is approved:
#   secret  SIGNPATH_API_TOKEN   CI user API token (this is the signing gate)
#   var     SIGNPATH_ORG_ID      SignPath organization id
# Project/policy slugs below must match the SignPath project (mia-toolkit /
# release-signing). Verify the signpath action version pin at approval time.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  macos:
    name: Build macOS (.dmg)
    needs: test
    runs-on: macos-latest
    env:
      MIA_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      MIA_NOTARY_PROFILE: mia-notary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "MIA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build .app
        run: pyinstaller packaging/macos/mia.spec --noconfirm

      - name: Import signing certificate & notary credentials
        if: env.MIA_SIGN_ID != ''
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" >/dev/null
          xcrun notarytool store-credentials "mia-notary" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PW" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign + notarize + staple
        if: env.MIA_SIGN_ID != ''
        env:
          VERSION: ${{ env.MIA_VERSION }}
        run: packaging/macos/sign_notarize.sh

      - name: Build unsigned .dmg (no cert configured)
        if: env.MIA_SIGN_ID == ''
        run: |
          VER="${MIA_VERSION:-${GITHUB_REF_NAME#v}}"
          hdiutil create -volname "MIA Toolkit" \
            -srcfolder "dist/MIA Toolkit.app" \
            -ov -format UDZO "dist/MIA-Toolkit-${VER}.dmg"

      # G15: install the shipped artifact the way a user does (mount the DMG,
      # copy the .app out) and run its headless self-test: imports the bundle
      # and builds a DICOMDIR from a synthetic study. A broken bundle fails
      # here, before anything is uploaded or published.
      - name: Smoke-test the built .dmg (self-test)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -n1)
          MNT="$RUNNER_TEMP/mia-dmg"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          ditto "$MNT/MIA Toolkit.app" "$RUNNER_TEMP/smoke/MIA Toolkit.app"
          hdiutil detach "$MNT"
          BIN="$RUNNER_TEMP/smoke/MIA Toolkit.app/Contents/MacOS/mia"
          "$BIN" --version
          "$BIN" --selftest

      # G14: CycloneDX SBOM of the build environment (the Python packages the
      # bundle was frozen from; a superset of what ships, incl. PyInstaller).
      # Run as an isolated pipx tool so the SBOM tool itself isn't listed.
      - name: SBOM (CycloneDX, build environment)
        run: |
          set -euo pipefail
          VER="${MIA_VERSION:-${GITHUB_REF_NAME#v}}"
          pipx run --spec "cyclonedx-bom==7.5.0" cyclonedx-py environment \
            --pyproject pyproject.toml --of JSON \
            -o "dist/MIA-Toolkit-${VER}-macos.cdx.json" \
            "$(python -c 'import sys; print(sys.executable)')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.cdx.json

  windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    # Signing runs only when the SignPath token is present; otherwise an
    # UNSIGNED installer is built (SmartScreen "unknown publisher" until then),
    # mirroring the macOS job's signing gate.
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "MIA_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/windows/mia-windows.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"

      # SignPath flow: upload the unsigned installer as a GitHub artifact,
      # submit a signing request to SignPath Foundation, then replace the
      # installer with the signed result. (The release job filters artifacts by
      # name, so this unsigned intermediate is never published.)
      - name: Upload unsigned installer (SignPath input)
        if: env.SIGNPATH_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-DO-NOT-SHIP
          path: dist/*.exe

      - name: Sign installer (SignPath Foundation)
        if: env.SIGNPATH_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@4f13d373e8f0cd8d3c0465ff4877feff27aed2ae # v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: mia-toolkit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Replace installer with signed build + verify
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item dist-signed\*.exe dist\ -Force
          $sig = Get-AuthenticodeSignature (Get-ChildItem dist\*.exe)[0].FullName
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      # G15: silently install the FINAL installer (the signed one, once
      # signing is live) per-user into a temp dir, then run the installed
      # app's headless self-test. The exe is a windowed (no-console) build, so
      # the result is read from the MIA_SELFTEST_REPORT file + the exit code.
      # A broken installer/bundle fails here, before anything is published.
      - name: Smoke-test the built installer (silent install + self-test)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\MIA-Toolkit-Setup-*.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP 'mia-install'
          $log = Join-Path $env:RUNNER_TEMP 'mia-install.log'
          $inst = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            ('/DIR="{0}"' -f $dir), ('/LOG="{0}"' -f $log))
          if ($inst.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "installer exited with $($inst.ExitCode)"
          }
          $exe = Join-Path $dir 'MIA Toolkit.exe'
          if (-not (Test-Path $exe)) { throw "installed app not found: $exe" }
          $env:MIA_SELFTEST_REPORT = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $t = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path $env:MIA_SELFTEST_REPORT) { Get-Content $env:MIA_SELFTEST_REPORT }
          if ($t.ExitCode -ne 0) { throw "self-test exited with $($t.ExitCode)" }

      # G14: CycloneDX SBOM of the build environment (see the macOS job).
      - name: SBOM (CycloneDX, build environment)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = if ($env:MIA_VERSION) { $env:MIA_VERSION } else { $env:GITHUB_REF_NAME -replace '^v','' }
          $py = python -c "import sys; print(sys.executable)"
          pipx run --spec "cyclonedx-bom==7.5.0" cyclonedx-py environment `
            --pyproject pyproject.toml --of JSON `
            -o "dist/MIA-Toolkit-$ver-windows.cdx.json" $py
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/*.cdx.json

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # Scoped to this job, not workflow-wide: attest-build-provenance needs an
    # OIDC token (id-token) and permission to store attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
          # Only the final artifacts — never the unsigned SignPath intermediate.
          pattern: "{macos-dmg,windows-exe}"
      # G14: one checksum file for every installer (`sha256sum -c` format). It
      # is the single source of the hashes; sync-website reads it for
      # version.json instead of re-hashing.
      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls *.dmg *.exe >/dev/null   # fail if either installer is missing
          sha256sum *.dmg *.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (installers)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS
      - name: Create/Update release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(artifacts/*.dmg artifacts/*.exe artifacts/*.cdx.json artifacts/SHA256SUMS)
          # --generate-notes lists merged PRs/commits since the previous tag;
          # hand-edit afterwards for the user-facing feature one-liners.
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes \
          || gh release upload "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  sync-website:
    name: Sync website download version
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the download.js sync commit
      actions: write    # dispatch pages.yml (token pushes don't auto-trigger)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Set version + asset URLs in website/download.js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Resolve the real asset names from the release (robust to naming).
          MAC_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.dmg$' | head -n1 || true)
          WIN_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.exe$' | head -n1 || true)
          MAC_URL=""; WIN_URL=""
          [ -n "$MAC_NAME" ] && MAC_URL="$BASE/$MAC_NAME"
          [ -n "$WIN_NAME" ] && WIN_URL="$BASE/$WIN_NAME"
          python3 - "$VER" "$MAC_URL" "$WIN_URL" <<'PY'
          import re, sys, pathlib
          ver, mac, win = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path("website/download.js"); s = p.read_text()
          s = re.sub(r'(version:\s*")[^"]*(")',
                     lambda m: m.group(1) + ver + m.group(2), s, count=1)
          s = re.sub(r'(macUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + mac + m.group(2), s, count=1)
          s = re.sub(r'(winUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + win + m.group(2), s, count=1)
          p.write_text(s)
          PY
          # version.json for the user-initiated in-app update check
          # (static, first-party, sha256 per asset for the IT guide). The
          # hashes come from the release's SHA256SUMS asset (written by the
          # release job), so checksums have one source of truth.
          mkdir -p /tmp/rel-assets && pushd /tmp/rel-assets >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p SHA256SUMS --clobber
          MAC_SHA=$(awk -v f="$MAC_NAME" '$2 == f || $2 == "*" f {print $1}' SHA256SUMS)
          WIN_SHA=$(awk -v f="$WIN_NAME" '$2 == f || $2 == "*" f {print $1}' SHA256SUMS)
          popd >/dev/null
          if [ -z "$MAC_NAME" ] || [ -z "$WIN_NAME" ] || [ -z "$MAC_SHA" ] || [ -z "$WIN_SHA" ]; then
            echo "::error::release assets/checksums missing (dmg='$MAC_NAME' sha='$MAC_SHA' exe='$WIN_NAME' sha='$WIN_SHA') — refusing to publish an invalid version.json"
            exit 1
          fi
          python3 - "$VER" "$MAC_URL" "$MAC_SHA" "$WIN_URL" "$WIN_SHA" <<'PY'
          import datetime, json, sys
          ver, mac, mac_sha, win, win_sha = sys.argv[1:6]
          data = {
              "version": ver,
              "date": datetime.date.today().isoformat(),
              "mac": {"url": mac, "sha256": mac_sha},
              "win": {"url": win, "sha256": win_sha},
              "notes": "https://github.com/Fritanga-Collective/mia-toolkit/releases",
          }
          open("website/version.json", "w").write(json.dumps(data, indent=1) + "\n")
          PY
      - name: Commit if changed + deploy the site
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- website/download.js website/version.json; then
            echo "site already in sync with $TAG"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/download.js website/version.json
          git commit -m "Website: sync download to ${TAG} (CI)"
          git push origin HEAD:main
          NEW_SHA=$(git rev-parse HEAD)
          # Commits pushed with GITHUB_TOKEN never trigger other workflows
          # (GitHub's recursion guard), so the Pages deploy must be dispatched
          # explicitly or the live site keeps serving the old version.
          # RACE: `gh workflow run pages.yml --ref main` resolves `main` to a SHA
          # *now* — if the push above hasn't propagated yet, it resolves the
          # pre-sync commit and Pages deploys the stale tree (the site kept
          # serving the old version until a manual re-deploy). So wait until the
          # API reports main == the commit we just pushed before dispatching.
          synced=false
          for _ in $(seq 1 30); do
            REMOTE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$REMOTE_SHA" = "$NEW_SHA" ]; then synced=true; break; fi
            echo "waiting for main to reflect $NEW_SHA (currently $REMOTE_SHA)…"
            sleep 2
          done
          # If main never reflected the push within the timeout, do NOT dispatch
          # — a dispatch now would resolve the stale SHA and redeploy the old
          # tree (the very bug this guards against). Fail loudly instead so the
          # release surfaces it; re-run pages.yml manually once main is updated.
          if [ "$synced" != true ]; then
            echo "::error::main did not reflect $NEW_SHA within timeout; refusing to dispatch a stale Pages deploy. Re-run pages.yml (--ref main) once main shows the sync commit."
            exit 1
          fi
          gh workflow run pages.yml --ref main
