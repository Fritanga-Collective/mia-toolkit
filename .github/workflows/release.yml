name: Release

# On a version tag (v1.2.3): test on all OSes, build the macOS .dmg and the
# Windows installer .exe, and attach both to the GitHub Release.
#
# macOS signing/notarization and Windows signing each run only when their
# secrets are present; otherwise UNSIGNED artifacts are built so the pipeline
# still produces downloads today (SmartScreen / Gatekeeper "unknown publisher"
# until the certs are added).
#
# Required secrets for signed macOS builds (optional until you have a cert):
#   MACOS_SIGN_ID         e.g. "Developer ID Application: NAME (TEAMID)"
#   MACOS_CERT_P12        base64 of the exported .p12 certificate
#   MACOS_CERT_PASSWORD   password for the .p12
#   APPLE_ID              Apple ID email (for notarytool)
#   APPLE_TEAM_ID         10-char Team ID
#   APPLE_APP_PASSWORD    app-specific password
#
# Windows signing via SignPath Foundation (free OSS code signing; publisher
# shows "SignPath Foundation"). Microsoft Trusted Signing is region-blocked for
# Mexico — dormant runbook in int-docs/infra/AZURE-TRUSTED-SIGNING.md.
# Required once the SignPath application is approved:
#   secret  SIGNPATH_API_TOKEN   CI user API token (this is the signing gate)
#   var     SIGNPATH_ORG_ID      SignPath organization id
# Project/policy slugs below must match the SignPath project (mia-toolkit /
# release-signing). Verify the signpath action version pin at approval time.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  macos:
    name: Build macOS (.dmg)
    needs: test
    runs-on: macos-latest
    env:
      MIA_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      MIA_NOTARY_PROFILE: mia-notary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "MIA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build .app
        run: pyinstaller packaging/macos/mia.spec --noconfirm

      - name: Import signing certificate & notary credentials
        if: env.MIA_SIGN_ID != ''
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" >/dev/null
          xcrun notarytool store-credentials "mia-notary" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PW" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign + notarize + staple
        if: env.MIA_SIGN_ID != ''
        env:
          VERSION: ${{ env.MIA_VERSION }}
        run: packaging/macos/sign_notarize.sh

      - name: Build unsigned .dmg (no cert configured)
        if: env.MIA_SIGN_ID == ''
        run: |
          VER="${MIA_VERSION:-${GITHUB_REF_NAME#v}}"
          hdiutil create -volname "MIA Toolkit" \
            -srcfolder "dist/MIA Toolkit.app" \
            -ov -format UDZO "dist/MIA-Toolkit-${VER}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    # Signing runs only when the SignPath token is present; otherwise an
    # UNSIGNED installer is built (SmartScreen "unknown publisher" until then),
    # mirroring the macOS job's signing gate.
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "MIA_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/windows/mia-windows.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"

      # SignPath flow: upload the unsigned installer as a GitHub artifact,
      # submit a signing request to SignPath Foundation, then replace the
      # installer with the signed result. (The release job filters artifacts by
      # name, so this unsigned intermediate is never published.)
      - name: Upload unsigned installer (SignPath input)
        if: env.SIGNPATH_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-DO-NOT-SHIP
          path: dist/*.exe

      - name: Sign installer (SignPath Foundation)
        if: env.SIGNPATH_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: mia-toolkit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Replace installer with signed build + verify
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item dist-signed\*.exe dist\ -Force
          $sig = Get-AuthenticodeSignature (Get-ChildItem dist\*.exe)[0].FullName
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Only the final artifacts — never the unsigned SignPath intermediate.
          pattern: "{macos-dmg,windows-exe}"
      - name: Create/Update release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --generate-notes lists merged PRs/commits since the previous tag;
          # hand-edit afterwards for the user-facing feature one-liners.
          gh release create "$TAG" artifacts/*.dmg artifacts/*.exe \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes \
          || gh release upload "$TAG" artifacts/*.dmg artifacts/*.exe \
            --repo "$GITHUB_REPOSITORY" --clobber

  sync-website:
    name: Sync website download version
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the download.js sync commit
      actions: write    # dispatch pages.yml (token pushes don't auto-trigger)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set version + asset URLs in website/download.js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Resolve the real asset names from the release (robust to naming).
          MAC_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.dmg$' | head -n1 || true)
          WIN_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.exe$' | head -n1 || true)
          MAC_URL=""; WIN_URL=""
          [ -n "$MAC_NAME" ] && MAC_URL="$BASE/$MAC_NAME"
          [ -n "$WIN_NAME" ] && WIN_URL="$BASE/$WIN_NAME"
          python3 - "$VER" "$MAC_URL" "$WIN_URL" <<'PY'
          import re, sys, pathlib
          ver, mac, win = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path("website/download.js"); s = p.read_text()
          s = re.sub(r'(version:\s*")[^"]*(")',
                     lambda m: m.group(1) + ver + m.group(2), s, count=1)
          s = re.sub(r'(macUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + mac + m.group(2), s, count=1)
          s = re.sub(r'(winUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + win + m.group(2), s, count=1)
          p.write_text(s)
          PY
          # version.json for the user-initiated in-app update check
          # (static, first-party, sha256 per asset for the IT guide).
          mkdir -p /tmp/rel-assets && pushd /tmp/rel-assets >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p '*.dmg' -p '*.exe' --clobber
          MAC_FILE=$(find . -maxdepth 1 -name '*.dmg' | head -n1)
          WIN_FILE=$(find . -maxdepth 1 -name '*.exe' | head -n1)
          if [ -z "$MAC_FILE" ] || [ -z "$WIN_FILE" ]; then
            echo "::error::release assets missing (dmg='$MAC_FILE' exe='$WIN_FILE') — refusing to publish an invalid version.json"
            exit 1
          fi
          MAC_SHA=$(shasum -a 256 "$MAC_FILE" | awk '{print $1}')
          WIN_SHA=$(shasum -a 256 "$WIN_FILE" | awk '{print $1}')
          popd >/dev/null
          python3 - "$VER" "$MAC_URL" "$MAC_SHA" "$WIN_URL" "$WIN_SHA" <<'PY'
          import datetime, json, sys
          ver, mac, mac_sha, win, win_sha = sys.argv[1:6]
          data = {
              "version": ver,
              "date": datetime.date.today().isoformat(),
              "mac": {"url": mac, "sha256": mac_sha},
              "win": {"url": win, "sha256": win_sha},
              "notes": "https://github.com/Fritanga-Collective/mia-toolkit/releases",
          }
          open("website/version.json", "w").write(json.dumps(data, indent=1) + "\n")
          PY
      - name: Commit if changed + deploy the site
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- website/download.js website/version.json; then
            echo "site already in sync with $TAG"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/download.js website/version.json
          git commit -m "Website: sync download to ${TAG} (CI)"
          git push origin HEAD:main
          # Commits pushed with GITHUB_TOKEN never trigger other workflows
          # (GitHub's recursion guard), so the Pages deploy must be dispatched
          # explicitly or the live site keeps serving the old version.
          gh workflow run pages.yml --ref main
