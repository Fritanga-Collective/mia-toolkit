name: Release

# On a version tag (v1.2.3): test on all OSes, build the macOS .dmg and the
# Windows installer .exe, and attach both to the GitHub Release.
#
# macOS signing/notarization and Windows signing each run only when their
# secrets are present; otherwise UNSIGNED artifacts are built so the pipeline
# still produces downloads today (SmartScreen / Gatekeeper "unknown publisher"
# until the certs are added).
#
# Required secrets for signed macOS builds (optional until you have a cert):
#   MACOS_SIGN_ID         e.g. "Developer ID Application: NAME (TEAMID)"
#   MACOS_CERT_P12        base64 of the exported .p12 certificate
#   MACOS_CERT_PASSWORD   password for the .p12
#   APPLE_ID              Apple ID email (for notarytool)
#   APPLE_TEAM_ID         10-char Team ID
#   APPLE_APP_PASSWORD    app-specific password
#
# Required secrets for signed Windows builds via Microsoft Trusted Signing
# (cloud, RSA, no hardware token — the gate is AZURE_CLIENT_ID):
#   AZURE_TENANT_ID            service-principal tenant
#   AZURE_CLIENT_ID            service-principal app id (signing gate)
#   AZURE_CLIENT_SECRET        service-principal secret
#   TRUSTED_SIGNING_ENDPOINT   e.g. https://eus.codesigning.azure.net
#   TRUSTED_SIGNING_ACCOUNT    Trusted Signing account name
#   TRUSTED_SIGNING_PROFILE    certificate profile name
# The service principal needs the "Trusted Signing Certificate Profile Signer"
# role on the account. Verify the azure/trusted-signing-action version pin.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  macos:
    name: Build macOS (.dmg)
    needs: test
    runs-on: macos-latest
    env:
      MIA_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      MIA_NOTARY_PROFILE: mia-notary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "MIA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build .app
        run: pyinstaller packaging/macos/mia.spec --noconfirm

      - name: Import signing certificate & notary credentials
        if: env.MIA_SIGN_ID != ''
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" >/dev/null
          xcrun notarytool store-credentials "mia-notary" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PW" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign + notarize + staple
        if: env.MIA_SIGN_ID != ''
        env:
          VERSION: ${{ env.MIA_VERSION }}
        run: packaging/macos/sign_notarize.sh

      - name: Build unsigned .dmg (no cert configured)
        if: env.MIA_SIGN_ID == ''
        run: |
          VER="${MIA_VERSION:-${GITHUB_REF_NAME#v}}"
          hdiutil create -volname "Medical Imaging Archiver" \
            -srcfolder "dist/Medical Imaging Archiver.app" \
            -ov -format UDZO "dist/MIA-Toolkit-${VER}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    # Signing runs only when Trusted Signing secrets are present; otherwise an
    # UNSIGNED installer is built (SmartScreen "unknown publisher" until then),
    # mirroring the macOS job's signing gate.
    env:
      TS_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Derive version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "MIA_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/windows/mia-windows.spec --noconfirm

      # Sign the bundled application executable first (the launcher users run),
      # before it's packed into the installer. Microsoft Trusted Signing =
      # cloud-based, RSA (Smart App Control accepts it), no hardware token.
      - name: Sign app executable (Trusted Signing)
        if: env.TS_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\MIAToolkit
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"

      # Sign the final installer (top-level dist\*.exe only; no recurse so we
      # don't re-sign the already-signed app exe under dist\MIAToolkit).
      - name: Sign installer (Trusted Signing)
        if: env.TS_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer signature
        if: env.TS_CLIENT_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature (Get-ChildItem dist\*.exe)[0].FullName
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create/Update release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/*.dmg artifacts/*.exe \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Automated release $TAG." \
          || gh release upload "$TAG" artifacts/*.dmg artifacts/*.exe \
            --repo "$GITHUB_REPOSITORY" --clobber

  sync-website:
    name: Sync website download version
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set version + asset URLs in website/download.js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Resolve the real asset names from the release (robust to naming).
          MAC_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.dmg$' | head -n1 || true)
          WIN_NAME=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -i '\.exe$' | head -n1 || true)
          MAC_URL=""; WIN_URL=""
          [ -n "$MAC_NAME" ] && MAC_URL="$BASE/$MAC_NAME"
          [ -n "$WIN_NAME" ] && WIN_URL="$BASE/$WIN_NAME"
          python3 - "$VER" "$MAC_URL" "$WIN_URL" <<'PY'
          import re, sys, pathlib
          ver, mac, win = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path("website/download.js"); s = p.read_text()
          s = re.sub(r'(version:\s*")[^"]*(")',
                     lambda m: m.group(1) + ver + m.group(2), s, count=1)
          s = re.sub(r'(macUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + mac + m.group(2), s, count=1)
          s = re.sub(r'(winUrl:\s*\n?\s*")[^"]*(")',
                     lambda m: m.group(1) + win + m.group(2), s, count=1)
          p.write_text(s)
          PY
      - name: Commit if changed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- website/download.js; then
            echo "download.js already in sync with $TAG"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/download.js
          git commit -m "Website: sync download to ${TAG} (CI)"
          git push origin HEAD:main
