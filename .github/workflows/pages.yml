name: Deploy website to GitHub Pages

# Publishes the static site in website/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Daily rebuild so date-scheduled blog posts publish themselves on their date
  # with no push (build.py date-gates posts; see website/README.md "Scheduling").
  schedule:
    - cron: "0 7 * * *"   # daily, 07:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps (Markdown — renders blog posts)
        run: pip install -r website/requirements.txt
      - name: Build the site (templates × languages + blog → _site)
        run: python3 website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site
      - id: deployment
        uses: actions/deploy-pages@v4
