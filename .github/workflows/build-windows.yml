name: Build Windows (manual test installer)

# Manual, on-demand build of the Windows x64 installer for testing — e.g.
# verifying install on Windows-on-ARM via x64 emulation. Produces an UNSIGNED
# installer and uploads it as a workflow artifact. Does NOT create a release,
# does NOT touch the website, does NOT tag. Run from any branch:
#   gh workflow run build-windows.yml --ref <branch>

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into the installer filename"
        required: false
        default: "0.0.0-test"

# Least privilege: checkout only (artifact upload uses the runtime token).
permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      MIA_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/windows/mia-windows.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-installer
          path: dist/*.exe
          if-no-files-found: error
