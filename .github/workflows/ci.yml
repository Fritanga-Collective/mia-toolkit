name: CI

# Runs the test suite on Linux, macOS, and Windows for every push/PR, plus a
# lint gate (ruff), a security lint gate (bandit, medium+ severity), a
# warn-only type check of mia_core (mypy), a dependency vulnerability audit
# (pip-audit) and the forms Worker unit tests (node:test).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Build-time-only dep for the website generator, so the blog-pipeline
      # tests (RSS + sitemap regression) actually run instead of skipping.
      - run: pip install -r website/requirements.txt
      - run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Rule set lives in pyproject.toml ([tool.ruff.lint]).
      - run: ruff check --output-format=github .

  security-lint:
    name: Security lint (bandit) + types (mypy, warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . bandit mypy
      # Fails on medium or high severity findings (-ll). The ~33 low-severity
      # findings (list-argv OS-tool subprocess calls without a shell,
      # try/except/pass, one non-crypto random) were reviewed 2026-10-21;
      # list them with `bandit -r mia mia_core` when touching those modules.
      - run: bandit -q -r mia mia_core -ll
      # PRODUCTION-READINESS G10: start warn-only on the core package; make
      # it gating once the existing findings are fixed (config in
      # pyproject.toml [tool.mypy]).
      - run: mypy mia_core
        continue-on-error: true

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Audit the same environment the tests run in (runtime + dev + website
      # build deps). Fails on any known vulnerability; add --ignore-vuln only
      # with a comment explaining why. The project itself is installed
      # editable and is not on PyPI, so it is skipped (its deps are audited).
      - run: pip install -e ".[dev]" -r website/requirements.txt pip-audit
      - run: pip-audit --skip-editable

  worker:
    name: Forms Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Plain node:test, no dependencies and no network.
      - run: node --test test/*.test.js
        working-directory: workers/forms
