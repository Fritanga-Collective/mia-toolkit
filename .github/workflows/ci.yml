name: CI

# Runs the test suite on Linux, macOS, and Windows for every push/PR, plus a
# lint gate (ruff), a dependency vulnerability audit (pip-audit) and the
# forms Worker unit tests (node:test).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Build-time-only dep for the website generator, so the blog-pipeline
      # tests (RSS + sitemap regression) actually run instead of skipping.
      - run: pip install -r website/requirements.txt
      - run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Rule set lives in pyproject.toml ([tool.ruff.lint]).
      - run: ruff check --output-format=github .

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Audit the same environment the tests run in (runtime + dev + website
      # build deps). Fails on any known vulnerability; add --ignore-vuln only
      # with a comment explaining why. The project itself is installed
      # editable and is not on PyPI, so it is skipped (its deps are audited).
      - run: pip install -e ".[dev]" -r website/requirements.txt pip-audit
      - run: pip-audit --skip-editable

  worker:
    name: Forms Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # Plain node:test, no dependencies and no network.
      - run: node --test test/*.test.js
        working-directory: workers/forms
