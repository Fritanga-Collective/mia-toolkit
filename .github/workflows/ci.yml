name: CI

# Runs the test suite on Linux, macOS, and Windows for every push/PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Build-time-only dep for the website generator, so the blog-pipeline
      # tests (RSS + sitemap regression) actually run instead of skipping.
      - run: pip install -r website/requirements.txt
      - run: pytest -q
